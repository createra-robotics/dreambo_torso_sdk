<!-- ===== Motion ===== -->
<section class="panel">
    <div class="panel-head">
        <span class="panel-label">Motion</span>
        <span class="panel-rule"></span>
    </div>

    <div class="flex flex-row gap-3 items-center" style="flex-wrap:wrap;">
        <select id="move-dataset-toggle">
            <option value="tonylabs/dreambo-dance-library">Dances</option>
            <option value="tonylabs/dreambo-emotions-library">Emotions</option>
        </select>
        <select id="move-select-toggle" style="flex:1; min-width:160px;"></select>

        <button id="move-play-btn" class="transport-btn play" title="Play move">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                <path d="M6.5 5.5v9l7-4.5-7-4.5z" />
            </svg>
        </button>
        <button id="move-stop-btn" class="transport-btn stop" title="Stop">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                <rect x="5" y="5" width="10" height="10" rx="2" />
            </svg>
        </button>
    </div>
</section>

<!-- ===== Audio ===== -->
<section class="panel">
    <div class="panel-head">
        <span class="panel-label">Audio</span>
        <span class="panel-rule"></span>
        <span class="device-info" id="volume-device-info">Loading…</span>
    </div>

    <div class="flex flex-col gap-4">
        <div class="flex flex-row gap-4 items-center">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 icon-muted" viewBox="0 0 20 20" fill="currentColor">
                <path d="M9.383 3.076A1 1 0 0110 4v12a1 1 0 01-1.707.707L4.586 13H2a1 1 0 01-1-1V8a1 1 0 011-1h2.586l3.707-3.707a1 1 0 011.09-.217z" />
            </svg>
            <input type="range" id="volume-slider" min="0" max="100" step="1" value="50"
                aria-label="System volume" class="flex-grow" />
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 icon-muted" viewBox="0 0 20 20" fill="currentColor">
                <path d="M10 3.5a1 1 0 00-1.707-.707L4.586 6.5H2a1 1 0 00-1 1v5a1 1 0 001 1h2.586l3.707 3.707A1 1 0 0010 16.5v-13zM15.536 5.464a1 1 0 010 1.415 5 5 0 010 7.071 1 1 0 11-1.415-1.414 3 3 0 000-4.243 1 1 0 011.415-1.415z" />
            </svg>
            <span id="volume-value" class="value-readout">50</span>
        </div>

        <details>
            <summary class="cursor-pointer select-none">Microphone</summary>
            <div class="mt-3 pl-4 pr-2 pb-2" style="border-left:2px solid var(--line);">
                <div class="flex flex-row gap-2 items-center" style="margin-bottom:8px;">
                    <span class="subpanel-title">Input level</span>
                    <span class="device-info" id="microphone-device-info">Loading…</span>
                </div>
                <div class="flex flex-row gap-4 items-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 icon-muted" viewBox="0 0 20 20" fill="currentColor">
                        <path d="M2.293 2.293a1 1 0 011.414 0l14 14a1 1 0 01-1.414 1.414l-14-14a1 1 0 010-1.414z" />
                        <path d="M13 8V4a3 3 0 10-6 0v1.293l6 6V8z" />
                        <path d="M8.707 13.707L7 12V8a3 3 0 013-3h.293l1.414 1.414A3 3 0 0113 8v4l-4.293-4.293z" />
                        <path d="M11 14.93V17h-2v-2.07A7.001 7.001 0 013 8a1 1 0 112 0 5 5 0 005 5 5.027 5.027 0 001-.101l1.414 1.414A6.956 6.956 0 0111 14.93zM15 8a1 1 0 10-2 0 3.001 3.001 0 01-.293 1.293l1.414 1.414A4.978 4.978 0 0015 8z" />
                    </svg>
                    <input type="range" id="microphone-slider" min="0" max="100" step="1" value="50"
                        aria-label="Microphone input volume" class="flex-grow" />
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 icon-muted" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M7 4a3 3 0 016 0v4a3 3 0 11-6 0V4zm4 10.93A7.001 7.001 0 0017 8a1 1 0 10-2 0A5 5 0 015 8a1 1 0 00-2 0 7.001 7.001 0 006 6.93V17H6a1 1 0 100 2h8a1 1 0 100-2h-3v-2.07z" clip-rule="evenodd" />
                    </svg>
                    <span id="microphone-value" class="value-readout">50</span>
                </div>
            </div>
        </details>
    </div>
</section>
