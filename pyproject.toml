[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "dreambo-torso"
version = "1.0.2"
authors = [{ name = "CreatEra Robotics", email = "contact@createra.tech" }]
description = ""
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2.5",
    "scipy>=1.15.3, <2.0.0",
    "dreambo_motor_controller>=1.1.1",
    "motorcom>=1.1.1",
    "psutil",
    "jinja2",
    "uvicorn[standard]",
    "fastapi",
    "python-multipart",
    "starlette<1.0.0",   #Fix: for starlette >= 1.0.0, we need to implement TemplateResponse(request, name, context)
    "pyserial",
    "huggingface-hub==1.3.0",
    "dreambo-torso-kinematics>=1.0.1",
    "asgiref",
    "aiohttp",
    "log-throttling==0.0.3",
    "pyusb>=1.2.1",
    "libusb_package>=1.0.26.3",
    "pip>=25",
    "rich",
    "questionary",
    "websockets>=12,<16",
    "toml",
    "servocom>=1.1.0",
    "pyyaml>=6.0",
    "requests>=2.28.0",
    "zeroconf>=0.131,<1",
    "pycaw>=20240210; sys_platform == 'win32'",
    "pulsectl>=24.1.0; sys_platform == 'linux'",
    "tornado>=6.5.5", # fix security issue of this subdependency
    "requests>=2.33.0", # fix security issue of this subdependency
    "gstreamer-bundle==1.28.1; sys_platform != 'linux'",
    # OS-specific: use PyGObject for Linux
    "PyGObject>=3.50.0; sys_platform == 'linux'",
    "pygobject-stubs>=2.17.0",
    "scipy-stubs>=1.15.3.0",
    "pycairo>=1.29.0",
]

[project.optional-dependencies]
examples = ["pynput", "soundfile", "opencv-python<=5.0", "cv2_enumerate_cameras>=1.2.1"]
mujoco = ["mujoco==3.3.0"]
nn_kinematics = ["onnxruntime==1.22.1"]
placo_kinematics = ["placo==0.9.14; sys_platform != 'win32'"]
rerun = ["rerun-sdk>=0.29.0,<=0.31.3"]
wireless-version = [
    "semver>=3,<4",
    "nmcli>=1.5; sys_platform == 'linux'",
    "imu-bmi088>=1.0.1; sys_platform == 'linux'",
    "gpiozero>=2.0.0; sys_platform == 'linux'",
    "lgpio>=0.2.2.0; sys_platform == 'linux'",
]
opencv = ["opencv-python<=5.0", "cv2_enumerate_cameras>=1.2.1"]
all = [
    "dreambo-torso[examples]",
    "dreambo-torso[mujoco]",
    "dreambo-torso[nn_kinematics]",
    "dreambo-torso[placo_kinematics]",
    "dreambo-torso[rerun]",
    "dreambo-torso[wireless-version]",
    "dreambo-torso[opencv]"
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff==0.12.0",
    "onshape-to-robot==1.7.6",
    "pre-commit",
    "mypy==1.18.2",
    "types-requests",
    "types-toml",
    "types-PyYAML",
]

[project.scripts]
dreambo-torso-daemon = "dreambo_torso.daemon.app.main:main"
dreambo-torso-app-assistant = "dreambo_torso.apps.app:main"
dreambo-torso-reflash-motors = "dreambo_torso.tools.reflash_motors:main"

[tool.uv]
dependency-metadata = [
    # Upstream metadata currently marks `gstreamer-msvc-runtime` as unconditional.
    # It should only be required on Windows.
    { name = "gstreamer-libs", version = "1.28.1", requires-dist = ["gstreamer-msvc-runtime; sys_platform == 'win32'", "setuptools"] },
]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true


[tool.setuptools.packages.find]
where = ["src"]


[tool.setuptools.package-data]
dreambo_torso = ["**/*"] # includes all non .py files

[tool.ruff]
exclude = [
    "src/dreambo_torso/__init__.py",
    "build/*",
    "conftest.py",
    "src/reachy_mini_dashboard/*",
    "tests/*",
]
lint.extend-select = ["I", "D"]
lint.ignore = [
    "D203", # Incompatible with D211
    "D213", # Incompatible with D212
]

[tool.pytest.ini_options]
testpaths = ["tests/unit_tests"]
markers = [
    "audio: mark test as requiring audio hardware",
    "video: mark test as requiring video hardware",
    "wireless: mark test as requiring wireless Dreambo",
    "ipc_resolution: override the resolution used by the ipc_video_source fixture",
]

[tool.mypy]
python_version = "3.12"
files = ["src/", "examples/"]
ignore_missing_imports = true
strict = true
